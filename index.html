<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Notepad - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="auth-container" id="auth-container">
            <h1>📝Notepad</h1>
            <p class="subtitle">Sign in to access your notes</p>
            
            <div class="toggle-buttons">
                <button class="toggle-btn active" id="show-login">Login</button>
                <button class="toggle-btn" id="show-signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-container">
                <h2>Welcome Back</h2>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button id="login-btn" class="primary-btn">Log In</button>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="form-container hidden">
                <h2>Create Account</h2>
                <input type="text" id="signup-name" placeholder="Display Name">
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password (min. 6 characters)" required>
                <button id="signup-btn" class="primary-btn">Sign Up</button>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Our Scripts -->
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
