<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notes — all your notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #b4b4b4;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .notes-container {
      width: 100%;
      background: #b4b4b4;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .notes-inner {
      padding: 1.75rem 2rem 2.5rem 2rem;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .notes-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .action-icons {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .icon-btn {
      background: #f8fafc;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 60px;
      color: #5b6e8c;
      transition: all 0.2s ease;
      font-size: 1.3rem;
      text-decoration: none;
    }
    .icon-btn i { font-size: 1.25rem; }
    .icon-btn:hover { background: #eef2ff; color: #1e40af; transform: scale(0.96); }

    /* Avatar Menu */
    .avatar-menu-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .avatar-btn {
      background: #f8fafc;
      border: none;
      cursor: pointer;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #1e293b;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }
    .avatar-btn:hover {
      background: #eef2ff;
      transform: scale(0.96);
    }
    .avatar-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 16px 32px rgba(0,0,0,0.12);
      min-width: 240px;
      z-index: 200;
      border: 1px solid #eef2f8;
      display: none;
      overflow: hidden;
    }
    .user-info-card {
      padding: 1rem;
      background: #f8fafc;
      border-bottom: 1px solid #eef2f8;
    }
    .user-name {
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.25rem;
    }
    .user-email {
      font-size: 0.8rem;
      color: #5b6e8c;
      word-break: break-all;
    }
    .user-uid {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      font-family: monospace;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      background: none;
      border: none;
      padding: 0.8rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .dropdown-item i { width: 1.2rem; color: #5b6e8c; }
    .dropdown-item:hover { background: #f8fafc; }
    .divider {
      margin: 0.5rem 0 1.5rem 0;
      border: 0;
      height: 1px;
      background: #e2e8f0;
    }
    .search-container {
      margin-bottom: 1rem;
      display: none;
    }
    .search-input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 2rem;
      font-family: inherit;
      outline: none;
    }
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.25rem;
      flex: 1;
    }
    .note-entry {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid #eef2f8;
      transition: all 0.2s ease;
      position: relative;
    }
    .note-entry:hover { border-color: #cbdff2; transform: translateY(-1px); }
    .note-title {
      font-size: 1.35rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .note-preview {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.45;
    }
    .delete-note {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      transition: color 0.2s;
    }
    .delete-note:hover { color: #ef4444; }
    .empty-message {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
      background: #fafcff;
      border-radius: 2rem;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
<div class="notes-container">
  <div class="notes-inner">
    <div class="header-row">
      <h1 class="notes-title">NOTES</h1>
      <div class="action-icons">
        <a href="addn.html" class="icon-btn" aria-label="Add new note"><i class="fas fa-plus"></i></a>
        <button class="icon-btn" id="searchToggleBtn" aria-label="Search"><i class="fas fa-search"></i></button>
        <div class="avatar-menu-wrapper" id="avatarWrapper">
          <button class="avatar-btn" id="avatarBtn">👤</button>
          <div id="avatarDropdown" class="avatar-dropdown">
            <div class="user-info-card" id="userInfoCard">
              <div class="user-name">Loading...</div>
              <div class="user-email">Loading...</div>
              <div class="user-uid">Loading...</div>
            </div>
            <button class="dropdown-item" id="changePasswordOption"><i class="fas fa-key"></i>Change password</button>
            <button class="dropdown-item" id="logoutOption"><i class="fas fa-sign-out-alt"></i>Logout</button>
          </div>
        </div>
      </div>
    </div>

    <div class="search-container" id="searchContainer">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by title or content...">
    </div>
    <hr class="divider">
    <div id="notesList" class="notes-list">
      <div class="loading">Loading your notes...</div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // Auth check
  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      window.location.href = 'index.html';
    } else {
      // Populate user info in avatar dropdown
      const userName = user.displayName || 'User';
      const userEmail = user.email;
      const userUID = user.uid;
      document.getElementById('user-name').innerText = userName;
      document.getElementById('user-email').innerText = userEmail;
      document.getElementById('user-uid').innerText = `UID: ${userUID}`;
      // Set avatar initial
      const avatarBtn = document.getElementById('avatarBtn');
      avatarBtn.innerText = userName.charAt(0).toUpperCase();
      // Load notes
      loadNotes();
    }
  });

  // Elements
  const notesListEl = document.getElementById('notesList');
  const searchToggle = document.getElementById('searchToggleBtn');
  const searchContainer = document.getElementById('searchContainer');
  const searchInput = document.getElementById('searchInput');
  let allNotes = [];
  let unsubscribe = null;

  function loadNotes() {
    const user = firebase.auth().currentUser;
    if (!user) return;
    if (unsubscribe) unsubscribe();
    notesListEl.innerHTML = '<div class="loading">Loading your notes...</div>';
    unsubscribe = db.collection('notes')
      .where('userId', '==', user.uid)
      .orderBy('updatedAt', 'desc')
      .onSnapshot(snapshot => {
        if (snapshot.empty) {
          notesListEl.innerHTML = '<div class="empty-message"><i class="fas fa-sticky-note"></i> No notes yet. Tap + to create one.</div>';
          allNotes = [];
          return;
        }
        allNotes = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderNotes();
      }, error => {
        console.error('Error loading notes:', error);
        notesListEl.innerHTML = '<div class="empty-message">Error loading notes. Please try again.</div>';
      });
  }

  function renderNotes(filter = '') {
    let filtered = allNotes;
    if (filter.trim() !== '') {
      const term = filter.toLowerCase();
      filtered = allNotes.filter(n => 
        (n.title && n.title.toLowerCase().includes(term)) || 
        (n.content && n.content.toLowerCase().includes(term))
      );
    }
    if (filtered.length === 0) {
      notesListEl.innerHTML = '<div class="empty-message"><i class="fas fa-sticky-note"></i> No notes match your search.</div>';
      return;
    }
    notesListEl.innerHTML = filtered.map(note => `
      <div class="note-entry">
        <div class="note-title">
          <span>${escapeHtml(note.title) || 'Untitled'}</span>
          <button class="delete-note" data-id="${note.id}"><i class="fas fa-trash-alt"></i></button>
        </div>
        <div class="note-preview">${escapeHtml((note.content || '').substring(0, 120))}${(note.content || '').length > 120 ? '…' : ''}</div>
      </div>
    `).join('');
    // attach delete events
    document.querySelectorAll('.delete-note').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        if (confirm('Delete this note?')) {
          db.collection('notes').doc(id).delete().catch(console.error);
        }
      });
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Search toggle
  searchToggle.addEventListener('click', () => {
    if (searchContainer.style.display === 'none' || !searchContainer.style.display) {
      searchContainer.style.display = 'block';
      searchInput.focus();
    } else {
      searchContainer.style.display = 'none';
      searchInput.value = '';
      renderNotes();
    }
  });
  searchInput.addEventListener('input', (e) => renderNotes(e.target.value));

  // Avatar dropdown
  const avatarBtn = document.getElementById('avatarBtn');
  const avatarDropdown = document.getElementById('avatarDropdown');
  function closeAvatarDropdown() { avatarDropdown.style.display = 'none'; }
  function toggleAvatarDropdown(e) {
    e.stopPropagation();
    avatarDropdown.style.display = avatarDropdown.style.display === 'block' ? 'none' : 'block';
  }
  avatarBtn.addEventListener('click', toggleAvatarDropdown);
  document.addEventListener('click', (e) => {
    if (!avatarBtn.contains(e.target) && !avatarDropdown.contains(e.target)) closeAvatarDropdown();
  });
  avatarDropdown.addEventListener('click', e => e.stopPropagation());

  // Change password and logout actions
  document.getElementById('changePasswordOption').addEventListener('click', () => {
    alert('🔐 Change password – this would open a password reset form.');
    closeAvatarDropdown();
  });
  document.getElementById('logoutOption').addEventListener('click', () => {
    firebase.auth().signOut().then(() => {
      window.location.href = 'index.html';
    });
  });
</script>
</body>
</html>
