<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notes — all your notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* (styles unchanged) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #b4b4b4;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .notes-container {
      width: 100%;
      background: #b4b4b4;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .notes-inner {
      padding: 1.75rem 2rem 2.5rem 2rem;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .notes-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .action-icons {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .icon-btn {
      background: #f8fafc;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 60px;
      color: #5b6e8c;
      transition: all 0.2s ease;
      font-size: 1.3rem;
      text-decoration: none;
    }
    .icon-btn i { font-size: 1.25rem; }
    .icon-btn:hover { background: #eef2ff; color: #1e40af; transform: scale(0.96); }

    /* Avatar Menu */
    .avatar-menu-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .avatar-btn {
      background: #f8fafc;
      border: none;
      cursor: pointer;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #1e293b;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }
    .avatar-btn:hover {
      background: #eef2ff;
      transform: scale(0.96);
    }
    .avatar-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 16px 32px rgba(0,0,0,0.12);
      min-width: 240px;
      z-index: 200;
      border: 1px solid #eef2f8;
      display: none;
      overflow: hidden;
    }
    .user-info-card {
      padding: 1rem;
      background: #f8fafc;
      border-bottom: 1px solid #eef2f8;
    }
    .user-name {
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.25rem;
    }
    .user-email {
      font-size: 0.8rem;
      color: #5b6e8c;
      word-break: break-all;
    }
    .user-uid {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      font-family: monospace;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      background: none;
      border: none;
      padding: 0.8rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .dropdown-item i { width: 1.2rem; color: #5b6e8c; }
    .dropdown-item:hover { background: #f8fafc; }
    .divider {
      margin: 0.5rem 0 1.5rem 0;
      border: 0;
      height: 1px;
      background: #e2e8f0;
    }
    .search-container {
      margin-bottom: 1rem;
      display: none;
    }
    .search-input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 2rem;
      font-family: inherit;
      outline: none;
    }
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.25rem;
      flex: 1;
    }
    .note-entry {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid #eef2f8;
      transition: all 0.2s ease;
      position: relative;
      cursor: pointer;
    }
    .note-entry:hover { border-color: #cbdff2; transform: translateY(-1px); }
    .note-title {
      font-size: 1.35rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .note-preview {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.45;
    }
    .delete-note {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      transition: color 0.2s;
      z-index: 2;
      position: relative;
    }
    .delete-note:hover { color: #ef4444; }
    .empty-message {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
      background: #fafcff;
      border-radius: 2rem;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      color: #94a3b8;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: all 0.2s ease;
    }
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-card {
      background: white;
      border-radius: 1.5rem;
      max-width: 400px;
      width: 90%;
      padding: 1.5rem;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
    }
    .modal-card h3 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }
    .modal-card input {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.75rem 2.5rem 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      font-family: inherit;
    }
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 1rem;
    }
    .password-wrapper input {
      margin-bottom: 0;
      width: 100%;
    }
    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 1.1rem;
      padding: 0;
      display: flex;
      align-items: center;
    }
    .toggle-password:hover { color: #5b6e8c; }
    .modal-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }
    .modal-buttons button {
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .modal-buttons .cancel-btn {
      background: #f1f5f9;
    }
    .modal-buttons .confirm-btn {
      background: #1e293b;
      color: white;
    }
    .modal-message {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      text-align: center;
      color: #ef4444;
    }
  </style>
</head>
<body>
<div class="notes-container">
  <div class="notes-inner">
    <div class="header-row">
      <h1 class="notes-title">NOTES</h1>
      <div class="action-icons">
        <a href="addn.html" class="icon-btn" aria-label="Add new note"><i class="fas fa-plus"></i></a>
        <button class="icon-btn" id="searchToggleBtn" aria-label="Search"><i class="fas fa-search"></i></button>
        <div class="avatar-menu-wrapper" id="avatarWrapper">
          <button class="avatar-btn" id="avatarBtn">👤</button>
          <div id="avatarDropdown" class="avatar-dropdown">
            <div class="user-info-card">
              <div class="user-name" id="user-name">Loading...</div>
              <div class="user-email" id="user-email">Loading...</div>
              <div class="user-uid" id="user-uid">Loading...</div>
            </div>
            <button class="dropdown-item" id="editNameOption"><i class="fas fa-user-edit"></i>Edit name</button>
            <button class="dropdown-item" id="changePasswordOption"><i class="fas fa-key"></i>Change password</button>
            <button class="dropdown-item" id="logoutOption"><i class="fas fa-sign-out-alt"></i>Logout</button>
          </div>
        </div>
      </div>
    </div>

    <div class="search-container" id="searchContainer">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by title or content...">
    </div>
    <hr class="divider">
    <div id="notesList" class="notes-list">
      <div class="loading">Loading your notes...</div>
    </div>
  </div>
</div>

<!-- Change Password Modal -->
<div id="changePwdModal" class="modal-overlay">
  <div class="modal-card">
    <h3>Change password</h3>
    <div class="password-wrapper">
      <input type="password" id="currentPwd" placeholder="Current password" autocomplete="off">
      <button type="button" class="toggle-password" data-target="currentPwd">
        <i class="far fa-eye-slash"></i>
      </button>
    </div>
    <div class="password-wrapper">
      <input type="password" id="newPwd" placeholder="New password (min 6 chars)">
      <button type="button" class="toggle-password" data-target="newPwd">
        <i class="far fa-eye-slash"></i>
      </button>
    </div>
    <div class="password-wrapper">
      <input type="password" id="confirmPwd" placeholder="Confirm new password">
      <button type="button" class="toggle-password" data-target="confirmPwd">
        <i class="far fa-eye-slash"></i>
      </button>
    </div>
    <div id="modalMessage" class="modal-message"></div>
    <div class="modal-buttons">
      <button class="cancel-btn" id="cancelChangePwd">Cancel</button>
      <button class="confirm-btn" id="confirmChangePwd">Update</button>
    </div>
  </div>
</div>

<!-- Edit Name Modal -->
<div id="editNameModal" class="modal-overlay">
  <div class="modal-card">
    <h3>Edit your name</h3>
    <input type="text" id="newName" placeholder="Your full name" autocomplete="off">
    <div id="editNameMessage" class="modal-message"></div>
    <div class="modal-buttons">
      <button class="cancel-btn" id="cancelEditName">Cancel</button>
      <button class="confirm-btn" id="confirmEditName">Save</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Auth check with email verification
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      if (!user.emailVerified) {
        firebase.auth().signOut().then(() => {
          window.location.href = 'index.html?verification=required';
        });
        return;
      }

      updateUserInfo(user);
      loadNotes();
    });

    function updateUserInfo(user) {
      const userName = user.displayName || 'User';
      const userEmail = user.email;
      const userUID = user.uid;
      document.getElementById('user-name').innerText = userName;
      document.getElementById('user-email').innerText = userEmail;
      document.getElementById('user-uid').innerText = `UID: ${userUID}`;
      const avatarBtn = document.getElementById('avatarBtn');
      avatarBtn.innerText = userName.charAt(0).toUpperCase();
    }

    let allNotes = [];
    let unsubscribe = null;
    const notesListEl = document.getElementById('notesList');
    const searchToggle = document.getElementById('searchToggleBtn');
    const searchContainer = document.getElementById('searchContainer');
    const searchInput = document.getElementById('searchInput');

    function loadNotes() {
      const user = firebase.auth().currentUser;
      if (!user) return;
      if (unsubscribe) unsubscribe();
      notesListEl.innerHTML = '<div class="loading">Loading your notes...</div>';
      unsubscribe = db.collection('notes')
        .where('userId', '==', user.uid)
        .orderBy('updatedAt', 'desc')
        .onSnapshot(snapshot => {
          allNotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          renderNotes();
        }, error => {
          notesListEl.innerHTML = `<div class="empty-message">Error: ${error.message}</div>`;
        });
    }

    function renderNotes(filter = '') {
      let filtered = allNotes;
      if (filter.trim()) {
        const term = filter.toLowerCase();
        filtered = allNotes.filter(n => 
          (n.title && n.title.toLowerCase().includes(term)) ||
          (n.content && n.content.toLowerCase().includes(term))
        );
      }
      if (filtered.length === 0) {
        notesListEl.innerHTML = '<div class="empty-message"><i class="fas fa-sticky-note"></i> No notes match your search.</div>';
        return;
      }
      notesListEl.innerHTML = filtered.map(note => `
        <div class="note-entry" data-id="${note.id}">
          <div class="note-title">
            <span>${escapeHtml(note.title) || 'Untitled'}</span>
            <button class="delete-note" data-id="${note.id}"><i class="fas fa-trash-alt"></i></button>
          </div>
          <div class="note-preview">${escapeHtml((note.content || '').substring(0, 120))}${(note.content || '').length > 120 ? '…' : ''}</div>
        </div>
      `).join('');

      document.querySelectorAll('.note-entry').forEach(entry => {
        entry.addEventListener('click', (e) => {
          if (e.target.closest('.delete-note')) return;
          const noteId = entry.dataset.id;
          if (noteId) {
            window.location.href = `addn.html?id=${noteId}`;
          }
        });
      });

      document.querySelectorAll('.delete-note').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (confirm('Delete this note?')) db.collection('notes').doc(id).delete();
        });
      });
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    searchToggle.addEventListener('click', () => {
      if (searchContainer.style.display === 'none' || !searchContainer.style.display) {
        searchContainer.style.display = 'block';
        searchInput.focus();
      } else {
        searchContainer.style.display = 'none';
        searchInput.value = '';
        renderNotes();
      }
    });
    searchInput.addEventListener('input', e => renderNotes(e.target.value));

    // Avatar dropdown
    const avatarBtn = document.getElementById('avatarBtn');
    const avatarDropdown = document.getElementById('avatarDropdown');
    function closeAvatarDropdown() { avatarDropdown.style.display = 'none'; }
    function toggleAvatarDropdown(e) { e.stopPropagation(); avatarDropdown.style.display = avatarDropdown.style.display === 'block' ? 'none' : 'block'; }
    avatarBtn.addEventListener('click', toggleAvatarDropdown);
    document.addEventListener('click', (e) => { if (!avatarBtn.contains(e.target) && !avatarDropdown.contains(e.target)) closeAvatarDropdown(); });
    avatarDropdown.addEventListener('click', e => e.stopPropagation());

    // Change password modal
    const changePwdModal = document.getElementById('changePwdModal');
    const currentPwd = document.getElementById('currentPwd');
    const newPwd = document.getElementById('newPwd');
    const confirmPwd = document.getElementById('confirmPwd');
    const modalMsg = document.getElementById('modalMessage');

    function openChangePwdModal() { changePwdModal.classList.add('active'); modalMsg.innerText = ''; currentPwd.value = ''; newPwd.value = ''; confirmPwd.value = ''; }
    function closeChangePwdModal() { changePwdModal.classList.remove('active'); }

    document.getElementById('changePasswordOption').addEventListener('click', () => { closeAvatarDropdown(); openChangePwdModal(); });
    document.getElementById('cancelChangePwd').addEventListener('click', closeChangePwdModal);

    document.getElementById('confirmChangePwd').addEventListener('click', async () => {
      const cur = currentPwd.value.trim();
      const newPw = newPwd.value.trim();
      const conf = confirmPwd.value.trim();
      if (!cur || !newPw || !conf) {
        modalMsg.innerText = 'All fields are required';
        return;
      }
      if (newPw.length < 6) {
        modalMsg.innerText = 'New password must be at least 6 characters';
        return;
      }
      if (newPw !== conf) {
        modalMsg.innerText = 'New passwords do not match';
        return;
      }

      const user = firebase.auth().currentUser;
      if (!user) {
        modalMsg.innerText = 'No user signed in';
        return;
      }

      const credential = firebase.auth.EmailAuthProvider.credential(user.email, cur);
      try {
        await user.reauthenticateWithCredential(credential);
        await user.updatePassword(newPw);
        modalMsg.innerText = 'Password updated successfully!';
        modalMsg.style.color = '#2c6e2c';
        setTimeout(closeChangePwdModal, 1500);
      } catch (error) {
        console.error('Change password error:', error);
        modalMsg.innerText = error.message;
        modalMsg.style.color = '#ef4444';
      }
    });

    // Edit name modal
    const editNameModal = document.getElementById('editNameModal');
    const newNameInput = document.getElementById('newName');
    const editNameMessage = document.getElementById('editNameMessage');

    function openEditNameModal() {
      const currentName = firebase.auth().currentUser?.displayName || '';
      newNameInput.value = currentName;
      editNameMessage.innerText = '';
      editNameModal.classList.add('active');
    }
    function closeEditNameModal() { editNameModal.classList.remove('active'); }

    document.getElementById('editNameOption').addEventListener('click', () => { closeAvatarDropdown(); openEditNameModal(); });
    document.getElementById('cancelEditName').addEventListener('click', closeEditNameModal);

    document.getElementById('confirmEditName').addEventListener('click', async () => {
      const newName = newNameInput.value.trim();
      if (!newName) {
        editNameMessage.innerText = 'Name cannot be empty';
        return;
      }

      const user = firebase.auth().currentUser;
      if (!user) {
        editNameMessage.innerText = 'No user signed in';
        return;
      }

      try {
        await user.updateProfile({ displayName: newName });
        editNameMessage.innerText = 'Name updated successfully!';
        editNameMessage.style.color = '#2c6e2c';
        updateUserInfo(user);
        setTimeout(closeEditNameModal, 1200);
      } catch (error) {
        console.error('Edit name error:', error);
        editNameMessage.innerText = error.message;
        editNameMessage.style.color = '#ef4444';
      }
    });

    document.getElementById('logoutOption').addEventListener('click', () => {
      firebase.auth().signOut().then(() => window.location.href = 'index.html');
    });

    // Password toggle for change password modal
    document.querySelectorAll('#changePwdModal .toggle-password').forEach(button => {
      button.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (input) {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
          input.setAttribute('type', type);
          const icon = this.querySelector('i');
          icon.classList.toggle('fa-eye-slash');
          icon.classList.toggle('fa-eye');
        }
      });
    });
  });
</script>
</body>
</html>
