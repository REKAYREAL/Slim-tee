<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes - CloudNotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📝 CloudNotes</h2>
                <button id="new-note-btn" class="new-note-btn">+ New Note</button>
            </div>
            
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">👤</div>
                <span id="user-display">Loading...</span>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>

            <div class="search-box">
                <input type="text" id="search-notes" placeholder="🔍 Search notes...">
            </div>

            <div class="notes-list" id="notes-list">
                <!-- Notes will appear here -->
            </div>
        </div>

        <!-- Main Editor Area -->
        <div class="main-content">
            <div class="editor-header">
                <input type="text" id="note-title" placeholder="Note title..." class="title-input">
                <div class="editor-actions">
                    <span id="last-saved" class="last-saved"></span>
                    <button id="save-note-btn" class="save-btn">💾 Save</button>
                    <button id="delete-note-btn" class="delete-btn">🗑️ Delete</button>
                </div>
            </div>
            
            <textarea id="note-content" placeholder="Start writing your note here..."></textarea>
            
            <div class="editor-footer">
                <span id="word-count">0 words</span>
                <span id="char-count">0 characters</span>
            </div>
        </div>
    </div>

    <input type="hidden" id="current-note-id">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="notes.js"></script>
</body>
</html>
