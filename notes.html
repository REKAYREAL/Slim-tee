<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notes — all your notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #b4b4b4;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .notes-container {
      width: 100%;
      background: #b4b4b4;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .notes-inner {
      padding: 1.75rem 2rem 2.5rem 2rem;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .notes-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .action-icons {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .icon-btn {
      background: #f8fafc;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 60px;
      color: #5b6e8c;
      transition: all 0.2s ease;
      font-size: 1.3rem;
      text-decoration: none;
    }
    .icon-btn i { font-size: 1.25rem; }
    .icon-btn:hover { background: #eef2ff; color: #1e40af; transform: scale(0.96); }
    .menu-wrapper { position: relative; display: inline-flex; align-items: center; }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 16px 32px rgba(0,0,0,0.12);
      min-width: 190px;
      z-index: 200;
      border: 1px solid #eef2f8;
      display: none;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      background: none;
      border: none;
      padding: 0.8rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      font-family: inherit;
    }
    .dropdown-item i { width: 1.2rem; color: #5b6e8c; }
    .dropdown-item:hover { background: #f8fafc; }
    .divider { margin: 0.5rem 0 1.5rem 0; border: 0; height: 1px; background: #e2e8f0; }

    /* search bar */
    .search-container {
      margin-bottom: 1rem;
      display: none;
    }
    .search-input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 2rem;
      font-family: inherit;
      outline: none;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.25rem;
      flex: 1;
    }
    .note-entry {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid #eef2f8;
      transition: all 0.2s ease;
      position: relative;
    }
    .note-entry:hover { border-color: #cbdff2; transform: translateY(-1px); }
    .note-title {
      font-size: 1.35rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .note-preview {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.45;
    }
    .delete-note {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      transition: color 0.2s;
    }
    .delete-note:hover { color: #ef4444; }
    .empty-message {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
      background: #fafcff;
      border-radius: 2rem;
    }
  </style>
</head>
<body>
<div class="notes-container">
  <div class="notes-inner">
    <div class="header-row">
      <h1 class="notes-title">NOTES</h1>
      <div class="action-icons">
        <a href="addn.html" class="icon-btn" aria-label="Add new note"><i class="fas fa-plus"></i></a>
        <button class="icon-btn" id="searchToggleBtn" aria-label="Search"><i class="fas fa-search"></i></button>
        <div class="menu-wrapper" id="menuWrapper">
          <button class="icon-btn" id="menuButton"><i class="fas fa-bars"></i></button>
          <div id="menuDropdown" class="dropdown-menu">
            <button class="dropdown-item" id="changePasswordOption"><i class="fas fa-key"></i>Change password</button>
            <button class="dropdown-item" id="logoutOption"><i class="fas fa-sign-out-alt"></i>Logout</button>
          </div>
        </div>
      </div>
    </div>

    <div class="search-container" id="searchContainer">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by title or content...">
    </div>
    <hr class="divider">
    <div id="notesList" class="notes-list"></div>
  </div>
</div>

<script>
  // Auth check
  if (!sessionStorage.getItem('isLoggedIn')) {
    window.location.href = 'login.html';
  }

  // ----- Notes logic -----
  let notes = [];

  function loadNotes() {
    const stored = localStorage.getItem('notes');
    notes = stored ? JSON.parse(stored) : [];
    renderNotes();
  }

  function saveNotes() {
    localStorage.setItem('notes', JSON.stringify(notes));
  }

  function deleteNote(id) {
    notes = notes.filter(n => n.id !== id);
    saveNotes();
    renderNotes();
  }

  function renderNotes(filter = '') {
    const container = document.getElementById('notesList');
    let filtered = notes;
    if (filter.trim() !== '') {
      const term = filter.toLowerCase();
      filtered = notes.filter(n => n.title.toLowerCase().includes(term) || n.content.toLowerCase().includes(term));
    }
    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-message"><i class="fas fa-sticky-note"></i> No notes yet. Tap + to create one.</div>`;
      return;
    }
    container.innerHTML = filtered.map(note => `
      <div class="note-entry">
        <div class="note-title">
          <span>${escapeHtml(note.title) || 'Untitled'}</span>
          <button class="delete-note" data-id="${note.id}"><i class="fas fa-trash-alt"></i></button>
        </div>
        <div class="note-preview">${escapeHtml(note.content.substring(0, 120))}${note.content.length > 120 ? '…' : ''}</div>
      </div>
    `).join('');
    // attach delete events
    document.querySelectorAll('.delete-note').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = Number(btn.dataset.id);
        deleteNote(id);
      });
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // search toggle
  const searchToggle = document.getElementById('searchToggleBtn');
  const searchContainer = document.getElementById('searchContainer');
  const searchInput = document.getElementById('searchInput');
  searchToggle.addEventListener('click', () => {
    if (searchContainer.style.display === 'none' || !searchContainer.style.display) {
      searchContainer.style.display = 'block';
      searchInput.focus();
    } else {
      searchContainer.style.display = 'none';
      searchInput.value = '';
      renderNotes();
    }
  });
  searchInput.addEventListener('input', (e) => {
    renderNotes(e.target.value);
  });

  // dropdown menu
  const menuBtn = document.getElementById('menuButton');
  const dropdown = document.getElementById('menuDropdown');
  function closeDropdown() { dropdown.style.display = 'none'; }
  function toggleDropdown(e) {
    e.stopPropagation();
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
  }
  menuBtn.addEventListener('click', toggleDropdown);
  document.addEventListener('click', (e) => {
    if (!menuBtn.contains(e.target) && !dropdown.contains(e.target)) closeDropdown();
  });
  document.getElementById('changePasswordOption').addEventListener('click', () => {
    alert('🔐 Change password (demo) – in a real app this would open a secure form.');
    closeDropdown();
  });
  document.getElementById('logoutOption').addEventListener('click', () => {
    sessionStorage.removeItem('isLoggedIn');
    window.location.href = 'login.html';
  });

  loadNotes();
</script>
</body>
</html>
