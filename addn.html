<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add new note</title>
  <style>
    /* (styles unchanged) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      background: #eef2f5;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .note-card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .card-inner {
      padding: 2rem 2rem 2rem 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .title-input {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      background: transparent;
      border: none;
      outline: none;
      font-weight: 500;
    }
    .title-input::placeholder { color: #8f9bb3; }
    .note-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .note-textarea {
      width: 100%;
      flex: 1;
      padding: 1rem;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.5;
      background: transparent;
      resize: vertical;
      border: none;
      outline: none;
    }
    .circle-btn {
      position: absolute;
      top: 1.25rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 20;
      border: none;
    }
    .circle-btn:hover { background: rgba(0, 0, 0, 0.08); }
    .back-circle { left: 1.25rem; }
    .menu-circle { right: 1.25rem; }
    .menu-icon {
      width: 18px;
      height: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .menu-icon span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: #3c4a5c;
      border-radius: 2px;
    }
    .back-icon svg {
      width: 20px;
      height: 20px;
      stroke: #3c4a5c;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .bg-palette {
      position: absolute;
      top: 70px;
      right: 1.25rem;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 12px 16px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      display: flex;
      gap: 14px;
      z-index: 25;
    }
    .bg-palette.hidden { display: none; }
    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s;
      border: none;
    }
    .color-swatch:hover { transform: scale(1.08); }
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,41,59,0.85);
      backdrop-filter: blur(12px);
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 30;
    }
    .toast-msg.show { opacity: 1; }
  </style>
</head>
<body>
<div class="note-card" id="noteCard">
  <div class="circle-btn back-circle" id="backBtn">
    <div class="back-icon"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg></div>
  </div>
  <div class="circle-btn menu-circle" id="menuBtn">
    <div class="menu-icon"><span></span><span></span><span></span></div>
  </div>
  <div class="bg-palette hidden" id="colorPalette">
    <div class="color-swatch" data-bg="#FFFFFF" style="background:#FFFFFF; box-shadow:0 0 0 1px #e2e8f0 inset;"></div>
    <div class="color-swatch" data-bg="#FFF9EF" style="background:#FFF9EF;"></div>
    <div class="color-swatch" data-bg="#F0F7FF" style="background:#F0F7FF;"></div>
    <div class="color-swatch" data-bg="#F5F3F0" style="background:#F5F3F0;"></div>
    <div class="color-swatch" data-bg="#F1F5F9" style="background:#F1F5F9;"></div>
  </div>

  <div class="card-inner">
    <input type="text" class="title-input" id="noteTitle" placeholder="Title">
    <div class="note-area">
      <textarea class="note-textarea" id="noteContent" placeholder="Note something down...."></textarea>
    </div>
  </div>
  <div id="toastMsg" class="toast-msg"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  let currentUser = null;
  let noteId = null;

  const urlParams = new URLSearchParams(window.location.search);
  noteId = urlParams.get('id');

  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      window.location.href = 'index.html';
    } else {
      currentUser = user;
      if (noteId) {
        loadNoteForEditing(noteId);
      }
    }
  });

  async function loadNoteForEditing(id) {
    if (!currentUser) return;
    try {
      const doc = await db.collection('notes').doc(id).get();
      if (!doc.exists) {
        showToast('Note not found', true);
        setTimeout(() => window.location.href = 'notes.html', 1500);
        return;
      }
      const data = doc.data();
      if (data.userId !== currentUser.uid) {
        showToast('You do not have permission to edit this note', true);
        setTimeout(() => window.location.href = 'notes.html', 1500);
        return;
      }
      document.getElementById('noteTitle').value = data.title || '';
      document.getElementById('noteContent').value = data.content || '';
    } catch (err) {
      console.error('Error loading note:', err);
      showToast('Error loading note', true);
      setTimeout(() => window.location.href = 'notes.html', 1500);
    }
  }

  // Background picker
  const noteCard = document.getElementById('noteCard');
  const menuBtn = document.getElementById('menuBtn');
  const backBtn = document.getElementById('backBtn');
  const colorPalette = document.getElementById('colorPalette');
  const toast = document.getElementById('toastMsg');

  let paletteVisible = false;

  function showPalette(show) {
    if (show) {
      colorPalette.classList.remove('hidden');
      paletteVisible = true;
    } else {
      colorPalette.classList.add('hidden');
      paletteVisible = false;
    }
  }

  function togglePalette() { showPalette(!paletteVisible); }

  function setNoteBackground(color) {
    if (color) noteCard.style.backgroundColor = color;
  }

  document.querySelectorAll('.color-swatch').forEach(swatch => {
    swatch.addEventListener('click', () => {
      setNoteBackground(swatch.getAttribute('data-bg'));
      showPalette(false);
    });
  });

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePalette();
  });
  document.addEventListener('click', (e) => {
    if (paletteVisible && !colorPalette.contains(e.target) && !menuBtn.contains(e.target)) {
      showPalette(false);
    }
  });
  colorPalette.addEventListener('click', e => e.stopPropagation());

  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  async function saveAndGoBack() {
    if (!currentUser) {
      window.location.href = 'index.html';
      return;
    }

    const title = document.getElementById('noteTitle').value.trim();
    const content = document.getElementById('noteContent').value.trim();
    if (title === '' && content === '') {
      window.location.href = 'notes.html';
      return;
    }

    const noteData = {
      userId: currentUser.uid,
      title: title || 'Untitled',
      content: content,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      if (noteId) {
        await db.collection('notes').doc(noteId).update(noteData);
        showToast('✓ Note updated');
      } else {
        noteData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('notes').add(noteData);
        showToast('✓ Note saved');
      }
      setTimeout(() => {
        window.location.href = 'notes.html';
      }, 400);
    } catch (error) {
      console.error('Error saving note:', error);
      showToast('Error saving note', true);
    }
  }

  backBtn.addEventListener('click', saveAndGoBack);
</script>
</body>
</html>
